<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Modern loyalty platform for small and medium businesses" />
    <title>SMB Loyalty App Platform</title>

    <!-- DNS Prefetch and Preconnect for faster loading -->
    <link rel="dns-prefetch" href="https://ybpgfkieomtsftbuadba.supabase.co" />
    <link rel="preconnect" href="https://ybpgfkieomtsftbuadba.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://js.stripe.com" />
    <link rel="preconnect" href="https://js.stripe.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.brevo.com" />

    <!-- Preconnect to Supabase auth and storage -->
    <link rel="preconnect" href="https://ybpgfkieomtsftbuadba.supabase.co" />
    <link rel="preconnect" href="https://api.brevo.com" />
    <style>
      /* Inline critical CSS for instant rendering */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #000000;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        min-height: 100vh;
      }
      #root {
        min-height: 100vh;
      }
      /* Fallback loading spinner */
      .loading-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        flex-direction: column;
        gap: 1rem;
      }
      .spinner {
        width: 64px;
        height: 64px;
        border: 4px solid rgba(249, 115, 22, 0.1);
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-text {
        color: #9ca3af;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-fallback">
        <div class="spinner"></div>
        <p class="loading-text">Loading...</p>
      </div>
    </div>
    <noscript>
      <div style="padding: 2rem; text-align: center;">
        <h1 style="margin-bottom: 1rem;">JavaScript Required</h1>
        <p style="color: #9ca3af;">Please enable JavaScript to use this application.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
